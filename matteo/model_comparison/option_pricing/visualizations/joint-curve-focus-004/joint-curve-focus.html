  const curveRows=curveX.map((x,i)=>({x,anchor:100*Math.sqrt(c.anchor[Math.min(i,2)]),selected:100*Math.sqrt(c.selected[Math.min(i,2)])}));
  panel(top,'Variance input · first year','curve',curveRows);
  for(const facet of data.facets){panel(root.querySelector('.m2-options'),`${facet.instrument} · ${facet.days} days · ${facet.role_label || 'fit'} · ${facet.points.length} options`,'option',facet);}
  function optionRows(facet){
    return facet.points.map(p=>{
      const r={x:p.x,original:p};
      if(mode==='iv'){
        r.market=[p.iv_mid,p.iv_bid,p.iv_ask];
        for(const k of ['anchor','selected'])r[k]=[p['iv_'+k],p['iv_'+k+'lo'],p['iv_'+k+'hi']];
      }else{
        const y=v=>mode==='price'?v:(v-p.mid)/p.scale;
        r.market=[y(p.mid),y(p.bid),y(p.ask)];
        r.anchor=[y(p.anchor),y(p.anchor-2*p.ase),y(p.anchor+2*p.ase)];
        r.selected=[y(p.selected),y(p.selected-2*p.sse),y(p.selected+2*p.sse)];
      }for(const key of ['anchor','selected'])if(p[key]===null)r[key]=[null,null,null];return r;
    });
  }
  function arrays(p){
    if(p.kind==='option')return optionRows(p.raw);
    return p.raw.map(r=>({x:r.x,
      ...(p.kind==='forward'?{market:[r.market,r.market,r.market]}:{}),
      anchor:[r.anchor,r.anchor-(r.ase||0)*2,r.anchor+(r.ase||0)*2],
      selected:[r.selected,r.selected-(r.sse||0)*2,r.selected+(r.sse||0)*2]}));
  }
  function extentY(rows){return d3.extent(rows.flatMap(r=>Object.keys(names).flatMap(k=>r[k]||[])).filter(Number.isFinite));}
  const unit=()=>mode==='iv'?'Annualized Black IV (%)':mode==='price'?'Undiscounted price (points)':'Midpoint error (quote scales)';
  const fmt=v=>v===null||!Number.isFinite(v)?'unavailable':d3.format('.3~f')(v);
  function draw(p,shared){
    const width=p.box.getBoundingClientRect().width;
    if(width<100)return;
    const height=p.kind==='option'?255:245;
    const m={l:72,r:15,t:12,b:54};
    const l=m.l,r=width-m.r,t=m.t,b=height-m.b;
    const svg=p.svg;svg.selectAll('*').remove();
    svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);
    svg.append('title').text(p.title);
    svg.append('desc').text(p.kind==='option'?`${unit()}; fixed market forwards; bid/ask market band and model plus or minus two sampling standard errors. Sampling bands exclude timestep, normalization, and quadrature bias.`:'Anchor and selected curve compared with market. Sampling error only where shown.');
    const rows=arrays(p),xd=d3.extent(rows,d=>d.x);
    let yd=shared||extentY(rows);let pad=(yd[1]-yd[0])*.08||1;
    yd=[yd[0]-pad,yd[1]+pad];
    const x=(p.kind==='option'?d3.scaleLog():d3.scaleLinear()).domain(xd).range([l+4,r-4]);
    const y=d3.scaleLinear().domain(yd).nice(4).range([b-3,t+3]);
    const clipId=`m2clip-${panels.indexOf(p)}`;
    svg.append('defs').append('clipPath').attr('id',clipId).append('rect').attr('x',l).attr('y',t).attr('width',r-l).attr('height',b-t);
    svg.append('rect').attr('data-chart-frame','').attr('x',l).attr('y',t).attr('width',r-l).attr('height',b-t).attr('fill','none').attr('stroke','var(--border)');
    const tickn=width<400?3:4;
    let xticks=p.kind==='option'?d3.ticks(xd[0],xd[1],tickn):x.ticks(tickn);
    const xa=svg.append('g').attr('transform',`translate(0,${b})`).call(d3.axisBottom(x).tickValues(xticks).tickFormat(p.kind==='option'?d3.format('.2~f'):d3.format('d')).tickSizeOuter(0));
    const ya=svg.append('g').attr('transform',`translate(${l},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(d3.format('~g')).tickSizeOuter(0));
    svg.append('g').attr('class','grid').attr('transform',`translate(${l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(-(r-l)).tickFormat('')).call(g=>g.select('.domain').remove());
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(l+r)/2).attr('y',height-8).attr('text-anchor','middle').text(p.kind==='option'?'Strike / market forward (log scale)':'Maturity / time (days)');
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(16,${(t+b)/2}) rotate(-90)`).attr('text-anchor','middle').text(p.kind==='option'?unit():p.kind==='forward'?'VIX forward (points)':'√ annual variance (%)');
    const g=svg.append('g').attr('clip-path',`url(#${clipId})`);
    if(p.kind==='option'&&xd[0]<1&&xd[1]>1)g.append('line').attr('x1',x(1)).attr('x2',x(1)).attr('y1',t).attr('y2',b).attr('stroke','var(--border)');
    if(p.kind==='option'&&mode==='residual')g.append('line').attr('x1',l).attr('x2',r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--foreground)').attr('stroke-opacity',.4);
    const curve=p.kind==='curve'?d3.curveStepAfter:d3.curveLinear;
    for(const key of Object.keys(names)){
      if(!shown[key]||!rows.some(d=>d[key]))continue;
      const line=d3.line().defined(d=>Number.isFinite(d[key]?.[0])).x(d=>x(d.x)).y(d=>y(d[key][0])).curve(curve);
      const area=d3.area().defined(d=>Number.isFinite(d[key]?.[1])&&Number.isFinite(d[key]?.[2])).x(d=>x(d.x)).y0(d=>y(d[key][1])).y1(d=>y(d[key][2])).curve(curve);
      const segments=p.kind==='option'?['put','call'].map(side=>rows.filter(r=>r.original.side===side)):[rows];
      for(const segment of segments){
        if(p.kind==='option')g.append('path').datum(segment).attr('d',area).attr('fill',colors[key]).attr('fill-opacity',key==='market'?.12:.1);
        g.append('path').datum(segment).attr('d',line).attr('fill','none').attr('stroke',colors[key]).attr('stroke-width',key==='market'?1.2:1.8).attr('stroke-dasharray',key==='anchor'?'5,3':null);
      }
      if(p.kind==='forward'){
        for(const row of rows){
          const v=row[key];if(!v)continue;
          g.append('line').attr('x1',x(row.x)).attr('x2',x(row.x)).attr('y1',y(v[1])).attr('y2',y(v[2])).attr('stroke',colors[key]);
          if(key==='market')g.append('path').attr('d',d3.symbol(d3.symbolDiamond,42)()).attr('transform',`translate(${x(row.x)},${y(v[0])})`).attr('fill',colors[key]);
          else g.append('circle').attr('cx',x(row.x)).attr('cy',y(v[0])).attr('r',3).attr('fill',colors[key]);
        }
      }
    }
    // Measure actual tick bounds. Drop optional ticks instead of shrinking text.
    function tidy(axis,horizontal){
      const nodes=axis.selectAll('.tick text').nodes();
      if(horizontal){nodes.forEach(n=>{const z=n.getBBox();if(z.x+Number(n.parentNode.getAttribute('transform').match(/[-\d.]+/)[0])<l)n.setAttribute('text-anchor','start');});}
      let last=null;
      nodes.forEach(n=>{const z=n.getBoundingClientRect();const start=horizontal?z.left:z.top,end=horizontal?z.right:z.bottom;if(last!==null&&start<last+4){n.parentNode.remove();}else last=end;});
    }
    tidy(xa,true);
    // Y ticks are emitted from low to high while screen coordinates run downward.
    const ynodes=ya.selectAll('.tick text').nodes().sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top);
    let prev=-Infinity;ynodes.forEach(n=>{const z=n.getBoundingClientRect();if(z.top<prev+4)n.parentNode.remove();else prev=z.bottom;});
    const hover=svg.append('g').attr('pointer-events','none').style('display','none');
    const guide=hover.append('line').attr('data-chart-hover-guide','').attr('y1',t).attr('y2',b).attr('stroke','var(--foreground)').attr('stroke-opacity',.5);
    const markers={};for(const key of Object.keys(names))markers[key]=hover.append('circle').attr('data-chart-hover-marker',key).attr('r',3.5).attr('fill',colors[key]);
    let pinned=false;
    function interp(key,q){
      const idx=d3.bisector(d=>d.x).left(rows,q);
      const u=rows[Math.max(0,idx-1)],v=rows[Math.min(rows.length-1,idx)];
      if(!u[key]||!v[key]||!rows.some(r=>Number.isFinite(r[key]?.[0])))return null;
      if(p.kind==='option'&&u.original.side!==v.original.side&&q!==u.x&&q!==v.x)return [null,null,null];
      const f=p.kind==='curve'||u.x===v.x?0:p.kind==='option'?(Math.log(q)-Math.log(u.x))/(Math.log(v.x)-Math.log(u.x)):(q-u.x)/(v.x-u.x);
      return u[key].map((z,j)=>Number.isFinite(z)&&Number.isFinite(v[key][j])?z+f*(v[key][j]-z):null);
    }
    function move(event){
      const px=Math.max(l+4,Math.min(r-4,d3.pointer(event,svg.node())[0]));const q=x.invert(px);
      hover.style('display',null);guide.attr('x1',px).attr('x2',px);
      let html=`<div>${p.title}</div><div>${p.kind==='option'?'K / F':'Days'} ${fmt(q)}</div><table>`;
      for(const key of Object.keys(names)){
        const v=shown[key]?interp(key,q):null;
        markers[key].style('display',v&&Number.isFinite(v[0])?null:'none');
        if(!shown[key]||!v)continue;
        if(Number.isFinite(v[0]))markers[key].attr('cx',px).attr('cy',y(v[0]));
        html+=`<tr><td>${key==='selected'?'Joint fit':key==='anchor'?'Anchor':'Market'}</td><td>${fmt(v[0])}</td></tr>`;
        if(p.kind!=='curve')html+=`<tr><td>${key==='market'?'Bid–ask':'±2 sampling SE'}</td><td>${fmt(v[1])} … ${fmt(v[2])}</td></tr>`;
      }
      if(p.kind==='option'){
        const near=rows[d3.bisector(d=>d.x).center(rows,q)].original;
        html+=`</table><div>Nearest quote: ${near.side} K ${fmt(near.k)}</div>`;
      }else html+='</table>';
      tooltip.innerHTML=html;tooltip.hidden=false;
      const rootRect=root.getBoundingClientRect(),svgr=svg.node().getBoundingClientRect();
      const tw=tooltip.getBoundingClientRect().width;
      tooltip.style.left=Math.max(0,Math.min(rootRect.width-tw,svgr.left-rootRect.left+px+12))+'px';
      tooltip.style.top=(svgr.top-rootRect.top+t+12)+'px';
    }
    svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',l).attr('y',t).attr('width',r-l).attr('height',b-t).attr('fill','transparent').on('pointermove',e=>{if(!pinned)move(e);}).on('pointerleave',()=>{if(!pinned){hover.style('display','none');tooltip.hidden=true;}}).on('click',e=>{pinned=!pinned;move(e);});
  }
  function drawAll(){
    tooltip.hidden=true;
    const extents={};
    for(const inst of ['SPX','VIX'])extents[inst]=extentY(data.facets.filter(f=>f.instrument===inst).flatMap(optionRows));
    panels.forEach(p=>draw(p,p.kind==='option'?extents[p.raw.instrument]:null));
    const means=data.invalid_iv.filter(d=>['anchor','selected'].includes(d.field)).length;
    const bounds=data.invalid_iv.filter(d=>/lo$|hi$/.test(d.field)).length;
    root.querySelector('#m2-focus-status').textContent=mode==='iv'?`7 SPX expiries · 4 model overlays · 3 market only · ${bounds} unavailable IV-band endpoints`:'707 SPX + 175 VIX fit options; extra SPX panels are market only';
  }
  control.addEventListener('change',()=>{mode=control.value;save();drawAll();});
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.mode;if(['iv','price','residual'].includes(s)){mode=s;control.value=s;drawAll();}});
  new ResizeObserver(drawAll).observe(root);
  drawAll();
})();
</script>
